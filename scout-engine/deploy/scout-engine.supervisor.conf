; Scout engine - install on VPS:
; sudo cp scout-engine.supervisor.conf /etc/supervisor/conf.d/scout-engine.conf
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start scout-engine
[program:scout-engine]
command=/usr/bin/node /home/malike/apps/scout-engine/dist/server.js
directory=/home/malike/apps/scout-engine
autostart=true
autorestart=true
user=malike
stdout_logfile=/var/log/supervisor/scout-engine.out.log
stderr_logfile=/var/log/supervisor/scout-engine.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopwaitsecs=30
environment=NODE_ENV="production"
