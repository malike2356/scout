# docker-compose.yml; Standalone Scout Engine + Postgres + Redis
# Start with: docker compose up -d
services:
  scout-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scout-engine
    ports:
      - '${SCOUT_PORT:-4444}:4444'
    environment:
      - SCOUT_PORT=4444
      - SCOUT_ENV=${SCOUT_ENV:-development}
      - SCOUT_DATABASE_URL=postgresql://scout:scout@scout-postgres:5432/scout
      - DATABASE_URL=postgresql://scout:scout@scout-postgres:5432/scout
      - REDIS_URL=redis://scout-redis:6379
      - SCOUT_API_KEY=${SCOUT_API_KEY:-change-me-in-production}
      - SCOUT_JWT_SECRET=${SCOUT_JWT_SECRET:-change-me-jwt-secret}
      - DB_HOST=scout-postgres
      - DB_PORT=5432
      - DB_USER=scout
      - DB_PASSWORD=scout
      - DB_NAME=scout
    depends_on:
      scout-postgres:
        condition: service_healthy
      scout-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4444/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  scout-postgres:
    image: postgres:16-alpine
    container_name: scout-postgres
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    ports:
      - '${SCOUT_PG_PORT:-5433}:5432'
    volumes:
      - scout-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scout -d scout']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  scout-redis:
    image: redis:7-alpine
    container_name: scout-redis
    ports:
      - '${SCOUT_REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - scout-redis-data:/data

volumes:
  scout-pg-data:
  scout-redis-data:
